<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dalley Logic Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class", // Enables dark mode strategy
            theme: {
                extend: {
                    colors: {
                        // Primary gradient colors will be handled via classes
                        primary: "#FF5E78", // A base vibrant pink-red
                        "accent-pink": "#FF9AAE",
                        // Backgrounds
                        "background-light": "#F3F4F6", // Light grey for light mode (fallback)
                        "background-dark": "#050505", // Pure black/near black for deep dark mode
                        // Surfaces
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#121212", // Slightly lighter black for cards
                        "surface-dark-highlight": "#1E1E1E", // Highlight state
                        // Text
                        "text-light-primary": "#1F2937",
                        "text-dark-primary": "#F9FAFB",
                        "text-dark-secondary": "#9CA3AF",
                    },
                    fontFamily: {
                        display: ["Poppins", "sans-serif"],
                        sans: ["Poppins", "sans-serif"],
                    },
                    borderRadius: {
                        'xl': '1rem',
                        '2xl': '1.5rem',
                        '3xl': '2rem',
                    },
                    boxShadow: {
                        'plush-dark': '0 4px 20px -2px rgba(0, 0, 0, 0.5)',
                        'glow-primary': '0 0 20px -5px rgba(255, 94, 120, 0.4)',
                    }
                },
            },
        };
    </script>
<style>.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }.text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #FF5E78, #FF9AAE);
        }.btn-plush {
            background: linear-gradient(135deg, #FF5E78 0%, #FF8A9E 100%);
            box-shadow: 0 10px 25px -5px rgba(255, 94, 120, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-sans antialiased text-text-light-primary dark:text-text-dark-primary h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-white">
<header class="flex items-center justify-between px-6 py-4 z-20 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md sticky top-0">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-200 dark:hover:bg-surface-dark-highlight transition-colors">
<span class="material-icons-round text-2xl text-gray-600 dark:text-gray-300">arrow_back</span>
</button>
<div>
<h1 class="text-sm font-medium text-gray-500 dark:text-gray-400">Object</h1>
<h2 class="text-lg font-bold">TextButton_3</h2>
</div>
</div>
<div class="flex gap-2">
<button class="p-2 rounded-full bg-white dark:bg-surface-dark shadow-sm border border-gray-100 dark:border-gray-800">
<span class="material-icons-round text-xl text-primary">bolt</span>
</button>
<button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-surface-dark-highlight transition-colors">
<span class="material-icons-round text-2xl text-gray-600 dark:text-gray-300">more_vert</span>
</button>
</div>
</header>
<main class="flex-1 overflow-y-auto no-scrollbar px-5 pb-24 pt-2">
<div class="mb-6 flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-icons-round text-primary text-xl">functions</span>
<span class="text-xl font-semibold">Functions</span>
</div>
<span class="text-xs font-medium px-3 py-1 rounded-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-800 text-gray-500 dark:text-gray-400">1 Configured</span>
</div>
<div class="group relative mb-5 rounded-2xl bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-800 shadow-sm dark:shadow-plush-dark overflow-hidden transition-all duration-300 active:scale-[0.98]">
<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-primary to-accent-pink"></div>
<div class="p-5 pl-7">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3">
<div class="p-2 rounded-xl bg-primary/10 dark:bg-primary/20">
<span class="material-icons-round text-primary text-lg">touch_app</span>
</div>
<div>
<h3 class="font-semibold text-base dark:text-white">On Click</h3>
<p class="text-xs text-gray-500 dark:text-gray-400">Event Trigger</p>
</div>
</div>
<div class="flex gap-1">
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-surface-dark-highlight text-green-500 transition-colors">
<span class="material-icons-round text-lg">play_arrow</span>
</button>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-surface-dark-highlight text-red-400 transition-colors">
<span class="material-icons-round text-lg">delete_outline</span>
</button>
</div>
</div>
<div class="space-y-3">
<div class="bg-gray-50 dark:bg-surface-dark-highlight rounded-xl p-3 flex justify-between items-center">
<span class="text-xs font-medium text-gray-500 dark:text-text-dark-secondary">Event Type</span>
<span class="text-xs font-semibold text-primary bg-primary/10 px-2 py-1 rounded-md">MouseButton1Click</span>
</div>
<div class="grid grid-cols-2 gap-3">
<div class="bg-gray-50 dark:bg-surface-dark-highlight rounded-xl p-3">
<span class="block text-[10px] uppercase tracking-wider text-gray-400 mb-1">Duration</span>
<span class="font-mono text-sm dark:text-white">1.0s</span>
</div>
<div class="bg-gray-50 dark:bg-surface-dark-highlight rounded-xl p-3">
<span class="block text-[10px] uppercase tracking-wider text-gray-400 mb-1">Target</span>
<span class="font-mono text-sm dark:text-white">Self</span>
</div>
</div>
</div>
</div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0.5 h-3 bg-gray-200 dark:bg-gray-800 translate-y-full z-0"></div>
</div>
<div class="group relative mb-5 rounded-2xl bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-800 shadow-sm dark:shadow-plush-dark overflow-hidden opacity-60 hover:opacity-100 transition-opacity">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-gray-300 dark:bg-gray-700"></div>
<div class="p-4 pl-6 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="p-2 rounded-xl bg-gray-100 dark:bg-surface-dark-highlight">
<span class="material-icons-round text-gray-500 text-lg">animation</span>
</div>
<div>
<h3 class="font-medium text-sm dark:text-gray-300">Play Animation</h3>
</div>
</div>
<span class="material-icons-round text-gray-400 text-lg">chevron_right</span>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent z-30 pointer-events-none">
<button class="w-full btn-plush pointer-events-auto h-14 rounded-full flex items-center justify-center gap-2 text-white font-semibold tracking-wide transition-transform active:scale-95">
<span class="material-icons-round text-xl">add</span>
            Add Function
        </button>
</div>
<nav class="bg-white dark:bg-surface-dark border-t border-gray-200 dark:border-gray-800 pb-6 pt-3 px-6 flex justify-between items-center z-40">
<button class="flex flex-col items-center gap-1 group">
<span class="material-icons-round text-2xl text-gray-400 group-hover:text-primary transition-colors">access_time</span>
<span class="text-[10px] text-gray-500 font-medium">Timeline</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-icons-round text-2xl text-gray-400 group-hover:text-primary transition-colors">layers</span>
<span class="text-[10px] text-gray-500 font-medium">Layers</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="relative">
<span class="material-icons-round text-2xl text-primary transition-colors">code</span>
<span class="absolute -top-1 -right-1 w-2 h-2 bg-primary rounded-full"></span>
</div>
<span class="text-[10px] text-primary font-medium">Logic</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-icons-round text-2xl text-gray-400 group-hover:text-primary transition-colors">settings</span>
<span class="text-[10px] text-gray-500 font-medium">Properties</span>
</button>
</nav>
<script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        } else {
            // Defaulting to dark mode for this specific design request as it looks best
            document.documentElement.classList.add('dark');
        }
    </script>

</body></html>
